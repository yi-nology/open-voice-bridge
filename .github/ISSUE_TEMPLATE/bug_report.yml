name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not paste API keys, tokens,
        certificates or real device MAC addresses — use `AA:BB:CC:DD:EE:FF`.
        Security vulnerabilities must be reported privately via SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the agent with ...
        2. Press the voice key ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `xiaomi-remote version`, or the release tag / commit.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Remote / input device
      placeholder: "Xiaomi Remote 2 Pro (RC003)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Distribution, desktop (X11/Wayland), PipeWire/BlueZ versions, Go version if built from source.
      placeholder: "Debian 13, Wayland, PipeWire 1.x, Go 1.27"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets and personal data before pasting.
      render: shell