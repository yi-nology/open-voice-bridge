name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet -tags stdjson ./...
      - name: Test
        run: go test -tags stdjson -count=1 ./...

  build:
    name: Build (${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${TAG#v}"
          name="open-voice-bridge_${version}_linux_${{ matrix.goarch }}"
          mkdir -p "dist/$name/bin"
          go build -tags stdjson -trimpath \
            -ldflags "-s -w -X main.version=$version" \
            -o "dist/$name/bin/xiaomi-remote" .
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          cp conf/config.example.json "dist/$name/"
          cp -r deploy "dist/$name/deploy"
          cp script/install-tarball.sh "dist/$name/install.sh"
          chmod +x "dist/$name/install.sh"
          tar -czf "dist/${name}.tar.gz" -C dist "$name"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.goarch }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Extract changelog section
        run: |
          version="${TAG#v}"
          # 双通道（S9）: a hyphen in the tag (v0.3.0-rc.1) marks the preview
          # channel — published, but flagged pre-release so the stable channel
          # stays clean.
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          awk -v hdr="## $version" 'index($0,hdr)==1{f=1;print;next} f&&/^## /{exit} f{print}' \
            CHANGELOG.md > notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s notes.md ]; then
            gh release create "$TAG" dist/* \
              --title "Open Voice Bridge $TAG" \
              --notes-file notes.md \
              $prerelease \
              --verify-tag
          else
            gh release create "$TAG" dist/* \
              --title "Open Voice Bridge $TAG" \
              --generate-notes \
              $prerelease \
              --verify-tag
          fi