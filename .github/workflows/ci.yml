name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet -tags stdjson ./...
      - name: Dependency rules (ARC-11)
        run: script/check-deps.sh
      # Lint 用 go install 本地构建,不用预编译 action:
      # action 下载的 golangci-lint 二进制构建于旧版 Go(实测 latest 构建于 go1.24),
      # 而 go.mod 的 go 指令是 1.27.4 ⇒ 「Go language version (go1.24) used to build
      # golangci-lint is lower than the targeted Go version (1.27.4)」exit 3,
      # main 三连红。go install 用 setup-go 的工具链(go-version-file 跟随 go.mod)
      # 构建 lint 二进制 ⇒ 版本检查恒过,工具链升级零维护。
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          "$(go env GOPATH)/bin/golangci-lint" run --timeout 5m --max-issues-per-linter 0 --max-same-issues 0
      - name: Vuln check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -tags stdjson ./...
      - name: Secret scan
        run: script/check-secrets.sh
      - name: Test (race + coverage)
        run: go test -tags stdjson -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
      - name: Build
        run: go build -tags stdjson ./...

  cross:
    name: Build (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, windows]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: go build ./...
