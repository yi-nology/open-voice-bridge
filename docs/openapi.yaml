                    description: 成功响应
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/KeymapProfilesResp'
    /api/keymap/apply:
        post:
            summary: ApplyKeymapProfile
            tags:
                - XiaomiRemoteApi
            operationId: XiaomiRemoteApi.ApplyKeymapProfile
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                profile:
                                    type: string
            responses:
                "200":
                    description: 成功响应
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OperationResp'
    /api/keymap/save:
        post:
            summary: SaveKeymapProfile
            tags:
                - XiaomiRemoteApi
            operationId: XiaomiRemoteApi.SaveKeymapProfile
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                mapping:
                                    type: object
                                    additionalProperties:
                                        type: string
            responses:
                "200":
                    description: 成功响应
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OperationResp'
    /api/keymap/delete:
        post:
            summary: DeleteKeymapProfile
            tags:
                - XiaomiRemoteApi
