                "200":
                    description: 成功响应
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OperationResp'
    /api/asr/switch:
        post:
            summary: SwitchASR
            tags:
                - XiaomiRemoteApi
            operationId: XiaomiRemoteApi.SwitchASR
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                provider:
                                    type: string
            responses:
                "200":
                    description: 成功响应
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OperationResp'
    /api/asr/config:
        get:
            summary: GetASRConfig
            tags:
                - XiaomiRemoteApi
            operationId: XiaomiRemoteApi.GetASRConfig
            responses:
                "200":
                    description: 成功响应
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ASRConfigResp'
        post:
            summary: UpdateASRConfig
            tags:
                - XiaomiRemoteApi
            operationId: XiaomiRemoteApi.UpdateASRConfig
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                provider:
                                    type: string
                                fallback:
                                    type: array
