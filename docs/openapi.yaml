openapi: 3.0.3
info:
    title: Open Voice Bridge API
    description: Local RC003 and external input bridge API
    version: 0.1.0
paths:
    /healthz:
        get:
            summary: Health
            tags:
                - XiaomiRemoteApi
            operationId: XiaomiRemoteApi.Health
            responses:
                "200":
                    description: 成功响应
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthResp'
    /readyz:
        get:
            summary: Ready
            tags:
                - XiaomiRemoteApi
            operationId: XiaomiRemoteApi.Ready
